site_name: MiaCaoMigo Engineering

docs_dir: .
site_dir: ../site

exclude_docs: |
  /mkdocs.yml
  /.gitignore
  /.dockerignore
  /Dockerfile.docs.prod
  /.docs/

theme:
  name: material
  custom_dir: .docs/overrides

  logo: 00_Assets/00_Branding/00_logos/Logo_partialBack.png
  favicon: 00_Assets/00_Branding/01_icons/Logo_pBack.ico 

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.integrate

extra_css:
  - Extras/extra.css

plugins:
  - search
  - same-dir

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

  - toc:
      permalink: true

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false

