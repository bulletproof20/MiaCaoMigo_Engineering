site_name: MiaCaoMigo Engineering



theme:

  name: material

  palette:

    - scheme: default

      primary: indigo

      accent: indigo

      toggle:

        icon: material/brightness-7

        name: Switch to dark mode

    - scheme: slate

      primary: indigo

      accent: indigo

      toggle:

        icon: material/brightness-4

        name: Switch to light mode

  features:

    - navigation.tabs

    - navigation.sections

    - navigation.top

    - navigation.indexes

    - search.suggest

    - search.highlight

    - content.code.copy

    - content.tabs.link



plugins:

  - search



markdown_extensions:

  - admonition

  - attr_list

  - md_in_html

  - tables

  - toc:

      permalink: true

  - pymdownx.details

  - pymdownx.superfences:

      custom_fences:

        - name: mermaid

          class: mermaid

          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:

      alternate_style: true

  - pymdownx.emoji:

      emoji_index: !!python/name:material.extensions.emoji.twemoji

      emoji_generator: !!python/name:material.extensions.emoji.to_svg



extra:

  generator: false



